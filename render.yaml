version: "1"

databases:
  - name: opspilot-postgres
    databaseName: opspilot
    user: opspilot_user
    plan: free

services:
  - type: web
    name: opspilot-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-postgres
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: opspilot-postgres
          property: connectionString
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: CELERY_BROKER_URL
        value: "redis://localhost:6379/0"
      - key: CELERY_RESULT_BACKEND
        value: "redis://localhost:6379/0"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: BACKEND_CORS_ORIGINS
        value: '["https://opspilott.vercel.app"]'
