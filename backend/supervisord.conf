[supervisord]
nodaemon=true
user=root

[program:redis]
command=redis-server
autostart=true
autorestart=true
priority=10

[program:celery]
command=celery -A app.workers.celery_app.celery_app worker --loglevel=info
directory=/app
autostart=true
autorestart=true
priority=20

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=30
